<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Panel Black Rabbit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Syncopate:wght@700&display=swap">
<style>
:root{--ground:#07080a;--surface:#0e1013;--surface-2:#14171b;--line:#23262c;--text:#eceef0;--muted:#a0a4ad;--dim:#6b6f78;--accent:#ff6b1a;
--display:"Syncopate","Arial Black",sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;--util:"Barlow Condensed","Arial Narrow",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:inherit}
.wrap{max-width:980px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;line-height:1.15;letter-spacing:.01em}
label{display:block;font-family:var(--util);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface-2);border:1px solid #2d3138;padding:12px 14px;border-radius:0;min-height:46px}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
.btn{font-family:var(--util);font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;padding:11px 20px;min-height:44px;border:1px solid var(--accent);background:var(--accent);color:#0a0a0a;cursor:pointer}
.btn:hover{background:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-color:#3a3e46;color:var(--text)}
.btn.ghost:hover{border-color:var(--text);color:var(--text)}
.btn.danger{background:transparent;border-color:#5a2a2a;color:#ff8a80}
.btn.danger.sure{background:#c62828;border-color:#c62828;color:#fff}
.btn[disabled]{opacity:.6;cursor:wait}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);padding:32px 26px}
.login img{display:block;height:44px;margin:0 auto 22px}
.login h1{font-size:18px;text-align:center;margin-bottom:22px}
.msg{font-size:15px;margin-top:14px;min-height:1.2em}
.msg.err{color:#ff8a80}.msg.ok{color:#7ddc8a}
.setup{margin-top:18px;padding:16px;border:1px solid #5b4a1a;background:#1b1707;font-size:15px;color:#e9d88a}
.setup ol{margin:8px 0 0;padding-left:20px}
.setup code{background:#0006;padding:1px 6px;font-size:14px}
/* app */
.top{position:sticky;top:0;z-index:5;background:rgba(7,8,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.top img{height:30px}
.top .who{font-family:var(--util);letter-spacing:.22em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-top:24px}
.tabs button{flex:1;max-width:220px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font-family:var(--util);font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:15px;padding:14px 8px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 16px}
.bar input{flex:1 1 220px}
.count{font-family:var(--util);letter-spacing:.18em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.lead{background:var(--surface);border:1px solid var(--line);padding:18px 18px 16px;margin-bottom:12px}
.lead .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.lead h3{font-size:14px}
.lead time{font-family:var(--util);letter-spacing:.14em;color:var(--dim);font-size:14px;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.meta span{font-family:var(--util);letter-spacing:.14em;text-transform:uppercase;font-size:13px;border:1px solid var(--line);padding:3px 10px;color:var(--text)}
.lead p{margin:8px 0 12px;color:var(--muted);font-size:15px;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{padding:8px 14px;min-height:38px;font-size:13px}
.empty{padding:40px 16px;text-align:center;border:1px dashed #3a3e46;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.grid .full{grid-column:1/-1}
.hint{font-size:13px;color:var(--dim);margin-top:4px}
h2.sec{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:30px 0 -4px;font-family:var(--util);text-transform:uppercase;letter-spacing:.26em;font-weight:600}
.savebar{position:sticky;bottom:0;background:linear-gradient(to top,var(--ground) 70%,transparent);padding:18px 0 calc(18px + env(safe-area-inset-bottom,0));margin-top:24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
@media(max-width:640px){.grid{grid-template-columns:1fr}.tabs button{max-width:none}}
</style>
</head>

    <div style="display:flex;align-items:center;gap:14px"><span class="who">Panel</span><button class="btn ghost" id="logout" style="padding:8px 14px;min-height:38px;font-size:13px">Salir</button></div>
  </div></div>

  <div class="wrap">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-leads" aria-selected="true">Solicitudes</button>
      <button role="tab" id="t-content" aria-selected="false">Contenido</button>
    </div>

    <section id="p-leads">
      <div class="bar">
        <input id="q" type="search" placeholder="Buscar por nombre, ciudad, tipo…" aria-label="Buscar solicitudes">
        <button class="btn ghost" id="refresh">Actualizar</button>
        <button class="btn ghost" id="csv">Descargar CSV</button>
      </div>
      <div class="count" id="count"></div>
      <div id="list" style="margin-top:12px"></div>
    </section>

    <section id="p-content" class="hidden">
      <p style="color:var(--muted);margin:22px 0 0">Cambia los textos de la página. Si dejas un campo vacío, se usa el texto original. Los cambios se ven en el sitio en menos de un minuto.</p>
      <div class="grid" id="fields"></div>
      <div class="savebar"><button class="btn" id="save">Guardar cambios</button><span class="msg" id="save-msg" role="status" aria-live="polite" style="margin:0"></span></div>
    </section>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var FIELDS=[
    {sec:'Portada'},
    {k:'hero_a',l:'Título, primera línea',ph:'Energía natural.'},
    {k:'hero_b',l:'Título, línea destacada (naranja)',ph:'Progreso real.'},
    {k:'hero_lead',l:'Texto bajo el título',ph:'Black Rabbit acompaña a quienes entrenan…',area:1,full:1},
    {sec:'La marca'},
    {k:'marca_lead',l:'Texto de presentación',ph:'Black Rabbit nace en el deporte…',area:1,full:1},
    {sec:'Productos'},
    {k:'prod_zero',l:'Zero',ph:'Cafeína, vitaminas B, L-teanina…',area:1},
    {k:'prod_recover',l:'Recover',ph:'Vitamina B12, ácido fólico y magnesio…',area:1},
    {k:'prod_hydrate',l:'Hydrate',ph:'Vitaminas C y D, zinc y biotina…',area:1},
    {k:'prod_awake',l:'Awake',ph:'Cafeína y vitaminas B12 y D…',area:1},
    {sec:'Sección "Tu evento"'},
    {k:'cta_title',l:'Título',ph:'¿Quieres llevar Black Rabbit a tu evento?',full:1},
    {k:'cta_text',l:'Texto',ph:'Cuéntanos qué estás organizando…',area:1,full:1},
    {sec:'Contacto público'},
    {k:'email',l:'Correo de contacto',ph:'contacto@tudominio.cl',hint:'Se muestra en la página y sirve de respaldo si falla el formulario.'},
    {k:'whatsapp',l:'WhatsApp (con código de país)',ph:'56912345678',hint:'Solo números. Aparece un botón de WhatsApp.'},
    {k:'instagram',l:'Instagram',ph:'@blackrabbit'}
  ];
  var pw='',leads=[];
  try{pw=sessionStorage.getItem('br_pw')||'';}catch(e){}

  function api(method,url,body){
    var h={'x-admin-password':pw};
    if(body){h['Content-Type']='application/json';}
    return fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){return {status:r.status,ok:r.ok,data:j};});
    });
  }
  function showSetup(missing){
    var L={'BLOB_READ_WRITE_TOKEN':'Crear un almacenamiento <b>Blob</b> (Storage → Create → Blob) y conectarlo al proyecto.','ADMIN_PASSWORD':'Agregar la variable de entorno <code>ADMIN_PASSWORD</code> con la contraseña del panel (Settings → Environment Variables) y volver a desplegar.'};
    $('setup-list').innerHTML=(missing||[]).map(function(m){return '<li>'+(L[m]||m)+'</li>';}).join('');
    $('setup').classList.remove('hidden');
  }
  function enter(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); loadLeads(); loadContent(); }

  $('login-form').addEventListener('submit',function(e){
    e.preventDefault(); pw=$('pw').value; var m=$('login-msg'),b=$('login-btn');
    m.className='msg'; m.textContent='Verificando…'; b.disabled=true; $('setup').classList.add('hidden');
    api('GET','/api/leads').then(function(r){
      if(r.ok){try{sessionStorage.setItem('br_pw',pw);}catch(e){} m.textContent=''; leads=r.data.leads||[]; enter();}
      else if(r.status===503){m.className='msg err';m.textContent='El panel todavía no está configurado.';showSetup(r.data.missing);}
      else if(r.status===401){m.className='msg err';m.textContent='Contraseña incorrecta.';}
      else{m.className='msg err';m.textContent='No se pudo conectar. Prueba de nuevo.';}
    }).catch(function(){m.className='msg err';m.textContent='Sin conexión con el servidor.';}).then(function(){b.disabled=false;});
  });
  $('logout').addEventListener('click',function(){try{sessionStorage.removeItem('br_pw');}catch(e){} pw=''; location.reload();});

  /* tabs */
  function tab(which){
    var a=which==='leads';
    $('t-leads').setAttribute('aria-selected',a);$('t-content').setAttribute('aria-selected',!a);
    $('p-leads').classList.toggle('hidden',!a);$('p-content').classList.toggle('hidden',a);
  }
  $('t-leads').addEventListener('click',function(){tab('leads');});
  $('t-content').addEventListener('click',function(){tab('content');});

  /* solicitudes */
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(iso){var d=new Date(iso);return isNaN(d)?'':d.toLocaleString('es-CL',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
  function render(){
    var q=$('q').value.trim().toLowerCase();
    var rows=leads.filter(function(l){return !q||[l.nombre,l.email,l.telefono,l.tipo,l.ciudad,l.mensaje].join(' ').toLowerCase().indexOf(q)>-1;});
    $('count').textContent=rows.length+' de '+leads.length+' solicitudes';
    if(!rows.length){$('list').innerHTML='<div class="empty">'+(leads.length?'Nada coincide con la búsqueda.':'Aún no llegan solicitudes. Cuando alguien complete el formulario de la página, aparecerá aquí.')+'</div>';return;}
    $('list').innerHTML=rows.map(function(l,i){
      var wa=(l.telefono||'').replace(/[^\d]/g,'');
      var meta=[l.tipo,l.ciudad,l.fecha?('Evento: '+l.fecha):'',l.asistentes?(l.asistentes+' asistentes'):''].filter(Boolean).map(function(x){return '<span>'+esc(x)+'</span>';}).join('');
      return '<article class="lead"><div class="row"><h3>'+esc(l.nombre)+'</h3><time>'+esc(fmt(l.createdAt))+'</time></div>'
        +'<div class="meta">'+meta+'</div>'+(l.mensaje?'<p>'+esc(l.mensaje)+'</p>':'')
        +'<div class="acts">'
        +(l.email?'<a class="btn ghost" href="mailto:'+esc(l.email)+'">Correo</a>':'')
        +(l.telefono?'<a class="btn ghost" href="tel:'+esc(l.telefono)+'">Llamar</a>':'')
        +(wa.length>=8?'<a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/'+wa+'">WhatsApp</a>':'')
        +'<button class="btn danger" data-del="'+esc(l._url)+'">Eliminar</button></div></article>';
    }).join('');
  }
  function loadLeads(){
    $('count').textContent='Cargando…';
    api('GET','/api/leads').then(function(r){if(r.ok){leads=r.data.leads||[];render();}else{$('count').textContent='No se pudieron cargar las solicitudes.';}});
  }
  $('q').addEventListener('input',render);
  $('refresh').addEventListener('click',loadLeads);
  $('list').addEventListener('click',function(e){
    var b=e.target.closest('[data-del]'); if(!b)return;
    if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='¿Seguro? Toca de nuevo';setTimeout(function(){b.classList.remove('sure');b.textContent='Eliminar';},3500);return;}
    b.disabled=true;
    api('DELETE','/api/leads?url='+encodeURIComponent(b.getAttribute('data-del'))).then(function(r){if(r.ok){leads=leads.filter(function(l){return l._url!==b.getAttribute('data-del');});render();}else{b.disabled=false;b.textContent='Error, reintenta';}});
  });
  $('csv').addEventListener('click',function(){
    var cols=['createdAt','nombre','email','telefono','tipo','fecha','ciudad','asistentes','mensaje'];
    var csv=[cols.join(',')].concat(leads.map(function(l){return cols.map(function(c){return '"'+String(l[c]==null?'':l[c]).replace(/"/g,'""')+'"';}).join(',');})).join('\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));a.download='solicitudes-blackrabbit.csv';document.body.appendChild(a);a.click();a.remove();
  });

  /* contenido */
  $('fields').innerHTML=FIELDS.map(function(f){
    if(f.sec)return '<h2 class="sec full">'+esc(f.sec)+'</h2>';
    var el=f.area?'<textarea id="c-'+f.k+'" placeholder="'+esc(f.ph)+'" maxlength="1500"></textarea>':'<input id="c-'+f.k+'" placeholder="'+esc(f.ph)+'" maxlength="1500">';
    return '<div class="'+(f.full?'full':'')+'"><label for="c-'+f.k+'">'+esc(f.l)+'</label>'+el+(f.hint?'<div class="hint">'+esc(f.hint)+'</div>':'')+'</div>';
  }).join('');
  function loadContent(){
    fetch('/api/content').then(function(r){return r.json();}).then(function(c){
      FIELDS.forEach(function(f){if(f.k&&$('c-'+f.k)&&typeof c[f.k]==='string')$('c-'+f.k).value=c[f.k];});
    }).catch(function(){});
  }
  $('save').addEventListener('click',function(){
    var body={};FIELDS.forEach(function(f){if(f.k)body[f.k]=$('c-'+f.k).value.trim();});
    var m=$('save-msg'),b=$('save');b.disabled=true;m.className='msg';m.textContent='Guardando…';
    api('PUT','/api/content',body).then(function(r){
      if(r.ok){m.className='msg ok';m.textContent='Guardado. Ya está en la página.';}
      else{m.className='msg err';m.textContent=r.status===401?'Sesión vencida. Vuelve a entrar.':'No se pudo guardar.';}
    }).catch(function(){m.className='msg err';m.textContent='Sin conexión.';}).then(function(){b.disabled=false;});
  });

  /* sesión guardada */
  if(pw){api('GET','/api/leads').then(function(r){if(r.ok){leads=r.data.leads||[];enter();}else{pw='';try{sessionStorage.removeItem('br_pw');}catch(e){}}}).catch(function(){});}
})();
</script>
</body>
</html>
